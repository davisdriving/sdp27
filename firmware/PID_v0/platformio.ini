[env:adafruit_feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
lib_deps = 
	adafruit/Adafruit LIS3DH@^1.3.0
	adafruit/Adafruit Unified Sensor@^1.1.15
	br3ttb/PID@^1.2.1
	waspinator/AccelStepper@^1.64
